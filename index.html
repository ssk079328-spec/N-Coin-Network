<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N-Coin Network</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div id="app-container">
        <div class="header">
            <div id="user-display">N-Coin User</div>
            <div class="balance-container">
                💰 <span id="balance">0</span> NC
            </div>
        </div>

        <div id="mine-page" class="page active">
            <div class="coin-area">
                <div id="coin" class="coin"></div>
            </div>
            <div class="energy-section">
                <div class="energy-bar"><div id="energy-fill"></div></div>
                <div class="energy-text">⚡ <span id="energy-val">1000</span>/1000</div>
            </div>
        </div>

        <div id="tasks-page" class="page">
            <h3>Daily Tasks</h3>
            <div class="card" onclick="watchAd()">📺 Watch Ad (+500 NC)</div>
            <div class="card" onclick="window.open('https://t.me/BestDailies')">📢 Join Channel (+1000 NC)</div>
        </div>

        <div id="frens-page" class="page">
            <h3>Invite Friends</h3>
            <p>প্রতি রেফারে পাবেন ৫০০০ NC</p>
            <div class="card" id="refer-link" onclick="copyLink()">Click to Copy Refer Link</div>
        </div>

        <div id="withdraw-page" class="page">
            <h3>Withdraw (বিকাশ/নগদ)</h3>
            <p>মিনিমাম উইথড্র: ৫০,০০০ NC</p>
            <input type="text" id="wallet-num" placeholder="017XXXXXXXX">
            <button class="claim-btn" onclick="requestWithdraw()">Request Cashout</button>
        </div>

        <nav class="bottom-nav">
            <button onclick="showPage('mine')">⚒️ Mine</button>
            <button onclick="showPage('tasks')">📋 Tasks</button>
            <button onclick="showPage('frens')">👥 Frens</button>
            <button onclick="showPage('withdraw')">💰 Cash</button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
